# /etc/nginx/sites-available/steamgram.app.conf
#
# Production host is the Oracle box (132.226.223.60). There, port 443 is an SNI
# stream router (/etc/nginx/streams-enabled/mtproto.conf) that hands steamgram.app
# names to the local HTTPS vhosts on 127.0.0.1:8443 over PROXY protocol, so this
# vhost listens there instead of on 443 directly. The router's map needs:
#     steamgram.app          web_https;
#     ~\.steamgram\.app$     web_https;
# The certificate covers steamgram.app and *.steamgram.app via the GoDaddy DNS plugin:
#     certbot certonly --authenticator dns-godaddy --dns-godaddy-credentials /etc/letsencrypt/godaddy.ini \
#       --dns-godaddy-propagation-seconds 120 -d steamgram.app -d '*.steamgram.app'
#
# Everything is proxied to the single Node process in Docker. Node is a blocking
# SQLite event loop, so nginx does the cheap work: caches static files, gzips
# responses and rate-limits the API per client. Apply with:
#   sudo cp deploy/nginx.steamgram.app.conf /etc/nginx/sites-available/steamgram.app.conf
#   sudo cp deploy/nginx.steamgram-proxy.conf /etc/nginx/snippets/steamgram-proxy.conf
#   sudo ln -sf /etc/nginx/sites-available/steamgram.app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# These two are http-level directives; sites-enabled is included inside http {}.
proxy_cache_path /var/cache/nginx/steamgram levels=1:2 keys_zone=steamgram:10m max_size=500m inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=steamgram_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name steamgram.app www.steamgram.app beta.steamgram.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Behind the stream SNI router (127.0.0.1:8443), fed via PROXY protocol
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name steamgram.app www.steamgram.app beta.steamgram.app;

    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/steamgram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steamgram.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The service worker and the app shell must never be cached, or a stale
    # shell gets pinned on every device that installed the PWA.
    location = /sw.js {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets, safe to cache for a year.
    location /assets/ {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        proxy_cache steamgram;
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache $upstream_cache_status;
    }

    # Icons, manifest, OG image: unhashed but rarely change.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webmanifest|woff2?)$ {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        proxy_cache steamgram;
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Cache $upstream_cache_status;
    }

    location /api/ {
        limit_req zone=steamgram_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
    }
}
