# /etc/nginx/sites-available/steamgram.app  (on the Raspberry Pi, 192.168.1.200)
#
# ru.steamgram.app is a mirror served from the Pi at home, for visitors whose
# networks block Oracle Cloud ranges. Same container, same port, its own pool.
# Certificate: certbot certonly --webroot -w /var/www/html -d ru.steamgram.app
#              --deploy-hook "systemctl reload nginx"
# Apply with:
#   sudo cp deploy/nginx.ru.steamgram.app.conf /etc/nginx/sites-available/steamgram.app
#   sudo cp deploy/nginx.steamgram-proxy.conf /etc/nginx/snippets/steamgram-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx

proxy_cache_path /var/cache/nginx/steamgram levels=1:2 keys_zone=steamgram:10m max_size=500m inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=steamgram_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ru.steamgram.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ru.steamgram.app;

    ssl_certificate     /etc/letsencrypt/live/ru.steamgram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.steamgram.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /sw.js {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        proxy_cache steamgram;
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache $upstream_cache_status;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webmanifest|woff2?)$ {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
        proxy_cache steamgram;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache $upstream_cache_status;
    }

    location /api/ {
        limit_req zone=steamgram_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:20090;
        include /etc/nginx/snippets/steamgram-proxy.conf;
    }
}
