<!doctype html><meta charset="utf-8">
<!--
  Source of public/og-image.png: a 1200x630 mock of the app chrome around the WASD mark.

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { margin: 0; background: #333; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0b0f17; color: #fff; }
  .glow { position: absolute; left: 300px; top: 20px; width: 600px; height: 600px; border-radius: 50%;
          background: radial-gradient(circle, rgba(102,192,244,0.22) 0%, rgba(102,192,244,0.06) 45%, rgba(11,15,23,0) 70%); }
  .segments { position: absolute; left: 24px; right: 24px; top: 14px; display: flex; gap: 8px; }
  .segments i { display: block; flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.28); }
  .segments i.on { background: #fff; }
  .pill { display: inline-flex; align-items: center; height: 44px; border-radius: 999px; background: rgba(0,0,0,0.45);
          border: 1.5px solid rgba(255,255,255,0.15); }
  .brand { position: absolute; left: 32px; top: 36px; padding: 0 12px 0 10px; }
  .brand .word { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; padding-left: 8px; }
  .brand .word b { color: #66c0f4; font-weight: 900; }
  .top-right { position: absolute; right: 32px; top: 36px; display: flex; align-items: center; gap: 10px; }
  .btn { position: relative; width: 44px; height: 44px; border-radius: 999px; background: rgba(0,0,0,0.45); border: 1.5px solid rgba(255,255,255,0.15);
         display: flex; align-items: center; justify-content: center; }
  .btn.active { background: #66c0f4; color: #000; border-color: rgba(255,255,255,0.3); }
  .btn svg { width: 22px; height: 22px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #fff; color: #000;
           font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .count { padding: 0 16px; font-size: 16px; color: #d4d4d8; margin-left: 4px; }
  .side { position: absolute; right: 32px; top: 120px; display: flex; flex-direction: column; gap: 14px; }
  .side .btn { width: 56px; height: 56px; }
  .side .btn svg { width: 26px; height: 26px; }
  .hero { position: absolute; left: 0; right: 0; top: 88px; display: flex; justify-content: center; }
  .hero svg { width: 340px; height: auto; overflow: visible; }
  .info { position: absolute; left: 48px; right: 140px; bottom: 44px; }
  .meta { font-size: 18px; color: #a1a1aa; margin-bottom: 8px; }
  .meta b { color: #66c0f4; font-weight: 600; }
  .meta span { margin: 0 6px; color: #71717a; }
  h2 { margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; }
  .by { margin: 8px 0 12px; font-size: 18px; color: #a1a1aa; }
  .desc { font-size: 22px; line-height: 1.35; color: #e4e4e7; max-width: 900px; }
  .tags { display: flex; gap: 10px; margin-top: 18px; }
  .tags span { border-radius: 999px; background: rgba(255,255,255,0.1); padding: 6px 14px; font-size: 16px; color: #e4e4e7; }
</style>
<div id="card">
  <div class="glow"></div>
  <div class="segments"><i class="on"></i><i></i><i></i><i></i><i></i></div>

  <div class="pill brand">
    <svg viewBox="80 120 352 258" width="40" height="29" style="overflow:visible">
      <defs>
        <linearGradient id="k1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd4ff"/><stop offset="1" stop-color="#4da8e0"/></linearGradient>
        <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fb5"/><stop offset="1" stop-color="#1e5a85"/></linearGradient>
      </defs>
      <g fill="none" stroke="#66c0f4" stroke-width="10" opacity="0.6"><rect x="201" y="126" width="110" height="110" rx="24"/><rect x="86" y="241" width="110" height="110" rx="24"/><rect x="316" y="241" width="110" height="110" rx="24"/></g>
      <g fill="#66c0f4" opacity="0.6" font-size="70" text-anchor="middle" font-weight="700"><text x="256" y="206">W</text><text x="141" y="321">A</text><text x="371" y="321">D</text></g>
      <rect x="201" y="261" width="110" height="110" rx="24" fill="url(#s1)"/><rect x="201" y="241" width="110" height="110" rx="24" fill="url(#k1)"/>
      <text x="256" y="322" font-size="76" text-anchor="middle" fill="#0b0f17" font-weight="700">S</text>
    </svg>
    <span class="word">Steam<b>Gram</b></span>
  </div>

  <div class="top-right">
    <div class="btn active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg><span class="badge">2</span></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span class="badge">2</span></div>
    <div class="pill count">40,000+ games</div>
  </div>

  <div class="side">
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-9.97 9.2l5.36 2.22a2.83 2.83 0 0 1 1.6-.5h.16l2.38-3.46v-.05a3.77 3.77 0 1 1 3.77 3.77h-.09l-3.4 2.43v.13a2.83 2.83 0 0 1-5.62.44L2.4 14.6A10 10 0 1 0 12 2zm-3.7 15.2-1.23-.51a2.13 2.13 0 0 0 3.94-.1 2.12 2.12 0 0 0-1.15-2.77l-1.27-.53a1.5 1.5 0 0 1 1.96-.03l1.29.53a2.1 2.1 0 0 1-3.54 3.41zm7.03-6.7a2.51 2.51 0 1 1 0-5.02 2.51 2.51 0 0 1 0 5.02zm0-4.4a1.89 1.89 0 1 0 0 3.78 1.89 1.89 0 0 0 0-3.78z"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.4 10.4 0 0 1 12 5c5 0 9 4 10 7a11.6 11.6 0 0 1-2.2 3.3M6.6 6.6C4.3 8 2.7 10.1 2 12c1 3 5 7 10 7a9.7 9.7 0 0 0 4.4-1"/></svg></div>
  </div>

  <div class="hero">
    <svg viewBox="80 120 352 258">
      <defs>
        <linearGradient id="k2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd4ff"/><stop offset="1" stop-color="#4da8e0"/></linearGradient>
        <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fb5"/><stop offset="1" stop-color="#1e5a85"/></linearGradient>
      </defs>
      <g fill="none" stroke="#66c0f4" stroke-width="10" opacity="0.6"><rect x="201" y="126" width="110" height="110" rx="24"/><rect x="86" y="241" width="110" height="110" rx="24"/><rect x="316" y="241" width="110" height="110" rx="24"/></g>
      <g fill="#66c0f4" opacity="0.6" font-size="70" text-anchor="middle" font-weight="700"><text x="256" y="206">W</text><text x="141" y="321">A</text><text x="371" y="321">D</text></g>
      <rect x="201" y="261" width="110" height="110" rx="24" fill="url(#s2)"/><rect x="201" y="241" width="110" height="110" rx="24" fill="url(#k2)"/>
      <text x="256" y="322" font-size="76" text-anchor="middle" fill="#0b0f17" font-weight="700">S</text>
    </svg>
  </div>

  <div class="info">
    <div class="meta"><b>Positive</b><span>·</span>free<span>·</span>no account<span>·</span>works on your phone</div>
    <h2>Doomscroll Steam</h2>
    <div class="by">by steamgram.app</div>
    <div class="desc">A full-screen feed of trailers for games you've never heard of. Swipe through, save the good ones, open them on Steam.</div>
    <div class="tags"><span>Indie</span><span>Hidden Gems</span><span>Trailers</span><span>Free to Play</span><span>PWA</span></div>
  </div>
</div>
<script>
window.render = async () => {
  await document.fonts.ready
  const canvas = await html2canvas(document.getElementById('card'), { backgroundColor: '#0b0f17', scale: 1, useCORS: true, logging: false })
  document.getElementById('card').replaceWith(canvas)
  return canvas.width + 'x' + canvas.height
}
window.addEventListener('load', () => window.render())
</script>
